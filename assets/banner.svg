<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 460" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c14" />
      <stop offset="50%" stop-color="#0d1527" />
      <stop offset="100%" stop-color="#070a12" />
    </linearGradient>
    <linearGradient id="accentBlue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.8" />
    </linearGradient>
    <linearGradient id="glowPulse" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0" />
    </linearGradient>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <style>
      @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
      @keyframes pulseDot { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.4; transform: scale(0.9); } }
      @keyframes radarSweep { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
      .cursor { animation: blink 1s infinite; fill: #38bdf8; }
      .live-dot { animation: pulseDot 2s infinite ease-in-out; transform-origin: center; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    </style>
  </defs>

  <!-- Background Canvas with Glows -->
  <rect width="940" height="460" rx="16" fill="url(#bgGradient)" stroke="#1e293b" stroke-width="1.5" />
  <circle cx="180" cy="80" r="140" fill="#38bdf8" opacity="0.06" filter="url(#subtleGlow)" />
  <circle cx="780" cy="380" r="160" fill="#818cf8" opacity="0.06" filter="url(#subtleGlow)" />
  <circle cx="470" cy="230" r="180" fill="#10b981" opacity="0.04" filter="url(#subtleGlow)" />

  <!-- Top System Bar -->
  <g transform="translate(24, 20)">
    <!-- Window Controls -->
    <circle cx="8" cy="8" r="6" fill="#f43f5e" />
    <circle cx="28" cy="8" r="6" fill="#fbbf24" />
    <circle cx="48" cy="8" r="6" fill="#10b981" />

    <!-- Center Badge -->
    <rect x="330" y="-3" width="230" height="24" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <circle cx="346" cy="9" r="4" fill="#10b981" class="live-dot" />
    <text x="358" y="13" fill="#cbd5e1" class="sans" font-size="11" font-weight="600" letter-spacing="0.5">REMOTE-HANDS CONTROL PLANE</text>

    <!-- Right Connectivity Indicator -->
    <text x="850" y="13" text-anchor="end" fill="#64748b" class="mono" font-size="11">RLS: ENFORCED • WSS: ACTIVE</text>
  </g>

  <!-- Divider -->
  <line x1="20" y1="52" x2="920" y2="52" stroke="#1e293b" stroke-width="1" />

  <!-- LEFT PANEL: 📱 Mobile Remote Card (iPhone Experience) -->
  <g transform="translate(32, 70)">
    <!-- Device Frame Outer -->
    <rect width="390" height="364" rx="14" fill="#090d16" stroke="#334155" stroke-width="1.2" />
    
    <!-- Phone Header -->
    <rect x="1" y="1" width="388" height="42" rx="13" fill="#0f172a" />
    <text x="18" y="26" fill="#f8fafc" class="sans" font-size="13" font-weight="700">📱 Mobile Client</text>
    <rect x="260" y="11" width="114" height="20" rx="10" fill="#064e3b" stroke="#059669" stroke-width="1" />
    <circle cx="272" cy="21" r="3.5" fill="#34d399" class="live-dot" />
    <text x="282" y="25" fill="#34d399" class="sans" font-size="10" font-weight="700">LIVE SCREEN</text>

    <!-- Dispatched Task Prompt -->
    <g transform="translate(16, 56)">
      <text x="0" y="12" fill="#94a3b8" class="sans" font-size="11" font-weight="600">ACTIVE DISPATCH</text>
      <rect y="20" width="358" height="38" rx="8" fill="#1e293b" stroke="#334155" stroke-width="0.8" />
      <text x="12" y="44" fill="#38bdf8" class="mono" font-size="12" font-weight="600">&gt; "Publish updated privacy policy on WP"</text>
    </g>

    <!-- Visual Screen Stream Card -->
    <g transform="translate(16, 128)">
      <rect width="358" height="114" rx="8" fill="#020617" stroke="#1e293b" stroke-width="1" />
      <!-- Browser Top Bar inside Stream -->
      <rect width="358" height="22" rx="7" fill="#0f172a" />
      <text x="10" y="15" fill="#64748b" class="mono" font-size="9.5">https://wordpress.internal/wp-admin/post.php?action=edit</text>
      <!-- Simulated Visual Snapshot -->
      <text x="14" y="48" fill="#f1f5f9" class="sans" font-size="13" font-weight="700">Edit Page: Privacy Policy</text>
      <rect x="14" y="60" width="180" height="8" rx="4" fill="#334155" />
      <rect x="14" y="74" width="220" height="8" rx="4" fill="#1e293b" />
      
      <!-- Target Cursor on Publish -->
      <rect x="252" y="70" width="92" height="26" rx="6" fill="#e11d48" opacity="0.9" />
      <text x="298" y="87" text-anchor="middle" fill="#ffffff" class="sans" font-size="11" font-weight="700">Publish</text>
      <!-- Target ring -->
      <circle cx="298" cy="83" r="14" fill="none" stroke="#f43f5e" stroke-width="1.5" stroke-dasharray="3,3" />
    </g>

    <!-- Approval Modal Card -->
    <g transform="translate(16, 254)">
      <rect width="358" height="96" rx="10" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.2" />
      
      <g transform="translate(14, 18)">
        <text x="0" y="10" fill="#fbbf24" class="sans" font-size="12" font-weight="800">⚠️ APPROVAL GATE INTERCEPT</text>
        <text x="226" y="10" fill="#a5b4fc" class="mono" font-size="10.5">TIMEOUT: 04:58</text>
        
        <text x="0" y="30" fill="#e2e8f0" class="sans" font-size="11">Agent is about to click <tspan fill="#f43f5e" font-weight="700">"Publish"</tspan> in logged-in Chrome.</text>
        
        <!-- Action Buttons -->
        <g transform="translate(0, 42)">
          <rect width="156" height="28" rx="6" fill="#059669" />
          <text x="78" y="18" text-anchor="middle" fill="#ffffff" class="sans" font-size="11.5" font-weight="700">✓ APPROVE</text>

          <rect x="170" width="156" height="28" rx="6" fill="#1e293b" stroke="#f43f5e" stroke-width="1" />
          <text x="248" y="18" text-anchor="middle" fill="#f43f5e" class="sans" font-size="11.5" font-weight="700">✕ REJECT</text>
        </g>
      </g>
    </g>
  </g>

  <!-- CENTER FLOW CONNECTOR ARROW -->
  <g transform="translate(432, 230)">
    <line x1="0" y1="0" x2="66" y2="0" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4,4" />
    <polygon points="66,-4 74,0 66,4" fill="#38bdf8" />
    <circle cx="36" cy="0" r="14" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" />
    <text x="36" y="4" text-anchor="middle" fill="#38bdf8" class="mono" font-size="11" font-weight="700">RLS</text>
  </g>

  <!-- RIGHT PANEL: 💻 Machine Terminal Card (Laptop Execution) -->
  <g transform="translate(516, 70)">
    <!-- Terminal Outer -->
    <rect width="390" height="364" rx="14" fill="#090d16" stroke="#334155" stroke-width="1.2" />
    
    <!-- Terminal Header -->
    <rect x="1" y="1" width="388" height="42" rx="13" fill="#0f172a" />
    <text x="18" y="26" fill="#f8fafc" class="sans" font-size="13" font-weight="700">💻 Daemon &amp; Agent</text>
    <rect x="250" y="11" width="124" height="20" rx="10" fill="#1e293b" stroke="#475569" stroke-width="0.8" />
    <text x="312" y="25" text-anchor="middle" fill="#94a3b8" class="mono" font-size="10.5">macOS • Node 22</text>

    <!-- Terminal Content Stream -->
    <g transform="translate(18, 62)">
      <!-- Line 1 -->
      <text x="0" y="16" fill="#64748b" class="mono" font-size="11.5">$ remote-hands-daemon --watch</text>

      <!-- Line 2 -->
      <text x="0" y="42" fill="#10b981" class="mono" font-size="11.5">✔ <tspan fill="#94a3b8">Connected to Supabase Realtime (WSS)</tspan></text>

      <!-- Line 3 -->
      <text x="0" y="68" fill="#10b981" class="mono" font-size="11.5">✔ <tspan fill="#94a3b8">Task claimed:</tspan> <tspan fill="#f1f5f9">8b20a156 (wp-policy)</tspan></text>

      <!-- Line 4 -->
      <text x="0" y="94" fill="#38bdf8" class="mono" font-size="11.5">⚡ <tspan fill="#cbd5e1">Attaching to Chrome: </tspan><tspan fill="#38bdf8">profile/Default:9222</tspan></text>

      <!-- Line 5 -->
      <text x="0" y="120" fill="#10b981" class="mono" font-size="11.5">✔ <tspan fill="#94a3b8">Navigated to wp-admin (already signed in)</tspan></text>

      <!-- Line 6 -->
      <text x="0" y="146" fill="#10b981" class="mono" font-size="11.5">✔ <tspan fill="#94a3b8">Drafted privacy policy text via agy</tspan></text>

      <!-- Line 7 -->
      <text x="0" y="172" fill="#10b981" class="mono" font-size="11.5">✔ <tspan fill="#94a3b8">Streaming viewport frames: 1080p @ 30fps</tspan></text>

      <!-- Intercept Box inside Terminal -->
      <g transform="translate(0, 192)">
        <rect width="354" height="66" rx="8" fill="#18181b" stroke="#f59e0b" stroke-width="1" />
        <text x="12" y="24" fill="#fbbf24" class="mono" font-size="11" font-weight="700">🛑 PreToolUse Gate Triggered</text>
        <text x="12" y="46" fill="#a1a1aa" class="mono" font-size="10.5">Target: <tspan fill="#f43f5e">DOM.click(#publish-button)</tspan></text>
        <text x="12" y="60" fill="#38bdf8" class="mono" font-size="10">State: PAUSED • Awaiting human authorization...</text>
      </g>

      <!-- Prompt Line -->
      <g transform="translate(0, 280)">
        <text x="0" y="16" fill="#a855f7" class="mono" font-size="12" font-weight="700">remote-hands</text>
        <text x="96" y="16" fill="#64748b" class="mono" font-size="12">&gt; status: awaiting_approval</text>
        <rect x="306" y="4" width="8" height="14" class="cursor" />
      </g>
    </g>
  </g>
</svg>
